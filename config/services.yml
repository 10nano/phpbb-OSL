imports:
    - { resource: tables.yml }

services:
    tennano.osl.league_manager:
        class: tennano\osl\service\league_manager
        arguments:
            - '@dbal.conn'
            - '%tennano.osl.tables.leagues%'
            - '%tennano.osl.tables.competitions%'
            - '%tennano.osl.tables.results%'

    tennano.osl.creator_permissions:
        class: tennano\osl\service\creator_permissions
        arguments:
            - '@dbal.conn'
            - '@auth'
            - '@user'
            - '%tennano.osl.tables.forum_creators%'

    tennano.osl.creator_controller:
        class: tennano\osl\controller\creator_controller
        arguments:
            - '@tennano.osl.creator_permissions'
            - '@controller.helper'
            - '@template'
            - '@request'
            - '@user'
            - '@language'
            - '@dbal.conn'
            - '%core.root_path%'
            - '%core.php_ext%'

    tennano.osl.export_writer:
        class: tennano\osl\service\export_writer

    tennano.osl.pdf_writer:
        class: tennano\osl\service\pdf_writer

    tennano.osl.export_controller:
        class: tennano\osl\controller\export_controller
        arguments:
            - '@tennano.osl.league_manager'
            - '@tennano.osl.export_writer'
            - '@tennano.osl.pdf_writer'
            - '@dbal.conn'
            - '@auth'
            - '@user'
            - '@language'

    tennano.osl.listener:
        class: tennano\osl\event\main_listener
        arguments:
            - '@tennano.osl.league_manager'
            - '@template'
            - '@request'
            - '@user'
            - '@auth'
            - '@language'
            - '@dbal.conn'
            - '%tennano.osl.tables.leagues%'
            - '%tennano.osl.tables.competitions%'
            - '%tennano.osl.tables.results%'
            - '@tennano.osl.creator_permissions'
            - '@controller.helper'
        tags:
            - { name: event.listener }
