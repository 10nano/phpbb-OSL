tennano_osl_manage_creators:
    path: /osl/creators/{forum_id}
    defaults: { _controller: tennano.osl.creator_controller:handle }
    requirements:
        forum_id: "\\d+"


tennano_osl_export:
    path: /osl/export/{topic_id}/{format}
    defaults: { _controller: tennano.osl.export_controller:download }
    requirements:
        topic_id: "\\d+"
        format: "csv|pdf"
