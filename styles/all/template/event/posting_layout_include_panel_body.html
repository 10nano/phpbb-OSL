<!-- IF S_OSL_CAN_CREATE_LEAGUE -->
<div class="panel bg3" id="osl-league-panel">
    <div class="inner">
        <fieldset class="fields2">
            <input type="hidden" name="osl_form_league" value="1" />
            <dl>
                <dt><label for="osl_enabled">{L_OSL_ENABLE_LEAGUE}</label></dt>
                <dd><input type="checkbox" name="osl_enabled" id="osl_enabled" value="1"<!-- IF OSL_ENABLED --> checked="checked"<!-- ENDIF --> /></dd>
            </dl>
            <div id="osl-league-settings"<!-- IF not OSL_ENABLED --> style="display:none"<!-- ENDIF -->>
                <dl><dt><label for="osl_title">{L_OSL_TITLE}</label></dt><dd><input class="inputbox autowidth" type="text" id="osl_title" name="osl_title" value="{OSL_TITLE}" size="50" maxlength="255" /></dd></dl>
                <dl><dt><label for="osl_short_name">{L_OSL_SHORT_NAME}</label></dt><dd><input class="inputbox autowidth" type="text" id="osl_short_name" name="osl_short_name" value="{OSL_SHORT_NAME}" size="20" maxlength="50" /></dd></dl>
                <dl><dt><label for="osl_start_date">{L_OSL_START_DATE}</label></dt><dd><input class="inputbox autowidth" type="date" id="osl_start_date" name="osl_start_date" value="{OSL_START_DATE}" /></dd></dl>
                <dl><dt><label for="osl_duration_months">{L_OSL_DURATION_MONTHS}</label></dt><dd><input class="inputbox autowidth" type="number" id="osl_duration_months" name="osl_duration_months" min="1" max="24" value="{OSL_DURATION_MONTHS}" /></dd></dl>
                <dl><dt><label for="osl_best_rounds">{L_OSL_BEST_ROUNDS}</label></dt><dd><input class="inputbox autowidth" type="number" id="osl_best_rounds" name="osl_best_rounds" min="0" max="24" value="{OSL_BEST_ROUNDS}" /></dd></dl>
                <dl><dt><label for="osl_groups_enabled">{L_OSL_GROUPS_ENABLED}</label></dt><dd><input type="checkbox" id="osl_groups_enabled" name="osl_groups_enabled" value="1"<!-- IF OSL_GROUPS_ENABLED --> checked="checked"<!-- ENDIF --> /></dd></dl>
                <hr />
                <h3>{L_OSL_COMPETITIONS}</h3>
                <p>{L_OSL_COMPETITIONS_HELP}</p>
                <div id="osl-competitions-container">
                    <!-- BEGIN osl_competitions -->
                    <div class="osl-competition panel bg2" data-osl-comp="{osl_competitions.INDEX}" style="padding:12px;margin:12px 0">
                        <input type="hidden" name="osl_comp_id[{osl_competitions.INDEX}]" value="{osl_competitions.ID}" />
                        <dl>
                            <dt><label>{L_OSL_COMPETITION_NAME}</label></dt>
                            <dd><input class="inputbox autowidth" type="text" name="osl_comp_name[{osl_competitions.INDEX}]" value="{osl_competitions.NAME}" size="35" maxlength="255" /></dd>
                        </dl>
                        <strong>{L_OSL_FIELDS_SCHEMA}</strong>
                        <div class="osl-comp-fields">
                            <!-- BEGIN osl_competitions.fields -->
                            <div class="osl-field-row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0">
                                <input class="inputbox autowidth" type="text" name="osl_comp_field_name[{osl_competitions.INDEX}][{osl_competitions.fields.INDEX}]" value="{osl_competitions.fields.NAME}" size="22" placeholder="{L_OSL_FIELD_NAME}" />
                                <label>{L_OSL_FIELD_MIN}: <input class="inputbox autowidth" style="width:75px" type="number" step="0.01" name="osl_comp_field_min[{osl_competitions.INDEX}][{osl_competitions.fields.INDEX}]" value="{osl_competitions.fields.MIN}" /></label>
                                <label>{L_OSL_FIELD_MAX}: <input class="inputbox autowidth" style="width:75px" type="number" step="0.01" name="osl_comp_field_max[{osl_competitions.INDEX}][{osl_competitions.fields.INDEX}]" value="{osl_competitions.fields.MAX}" /></label>
                                <button type="button" class="button2 osl-remove-field" title="{L_OSL_REMOVE_FIELD}">{L_OSL_REMOVE_FIELD}</button>
                            </div>
                            <!-- END osl_competitions.fields -->
                        </div>
                        <p><button type="button" class="button2 osl-add-field">{L_OSL_ADD_FIELD}</button> <button type="button" class="button2 osl-remove-competition">{L_OSL_REMOVE_COMPETITION}</button></p>
                    </div>
                    <!-- END osl_competitions -->
                </div>
                <p><button type="button" id="osl-add-competition" class="button2">{L_OSL_ADD_COMPETITION}</button></p>
                <p><small>{L_OSL_COMPETITION_LOCK_HELP}</small></p>
            </div>
        </fieldset>
    </div>
</div>
<!-- A template keeps dynamic HTML out of JavaScript string concatenation. -->
<template id="osl-new-field-template">
    <div class="osl-field-row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0">
        <input class="inputbox autowidth" type="text" name="osl_comp_field_name[__C__][__F__]" size="22" placeholder="{L_OSL_FIELD_NAME}" />
        <label>{L_OSL_FIELD_MIN}: <input class="inputbox autowidth" style="width:75px" type="number" step="0.01" name="osl_comp_field_min[__C__][__F__]" value="0" /></label>
        <label>{L_OSL_FIELD_MAX}: <input class="inputbox autowidth" style="width:75px" type="number" step="0.01" name="osl_comp_field_max[__C__][__F__]" value="40" /></label>
        <button type="button" class="button2 osl-remove-field">{L_OSL_REMOVE_FIELD}</button>
    </div>
</template>
<template id="osl-new-competition-template">
    <div class="osl-competition panel bg2" data-osl-comp="__C__" style="padding:12px;margin:12px 0">
        <input type="hidden" name="osl_comp_id[__C__]" value="0" />
        <dl><dt><label>{L_OSL_COMPETITION_NAME}</label></dt><dd><input class="inputbox autowidth" type="text" name="osl_comp_name[__C__]" size="35" maxlength="255" /></dd></dl>
        <strong>{L_OSL_FIELDS_SCHEMA}</strong>
        <div class="osl-comp-fields"></div>
        <p><button type="button" class="button2 osl-add-field">{L_OSL_ADD_FIELD}</button> <button type="button" class="button2 osl-remove-competition">{L_OSL_REMOVE_COMPETITION}</button></p>
    </div>
</template>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var checkbox = document.getElementById('osl_enabled');
    var settings = document.getElementById('osl-league-settings');
    var container = document.getElementById('osl-competitions-container');
    var add = document.getElementById('osl-add-competition');
    if (!container) { return; }
    var nextComp = 0;
    container.querySelectorAll('.osl-competition').forEach(function (item) {
        nextComp = Math.max(nextComp, parseInt(item.dataset.oslComp, 10) + 1 || 0);
    });
    if (checkbox) {
        checkbox.addEventListener('change', function () { settings.style.display = checkbox.checked ? '' : 'none'; });
    }
    function addField(comp) {
        var compIndex = comp.dataset.oslComp;
        var existing = comp.querySelectorAll('.osl-field-row');
        var nextField = 0;
        existing.forEach(function (item) {
            var input = item.querySelector('input[name^="osl_comp_field_name"]');
            var parts = input && input.name.match(/\[(\d+)\]\[(\d+)\]/);
            if (parts) { nextField = Math.max(nextField, Number(parts[2]) + 1); }
        });
        var markup = document.getElementById('osl-new-field-template').innerHTML.replace(/__C__/g, compIndex).replace(/__F__/g, nextField);
        comp.querySelector('.osl-comp-fields').insertAdjacentHTML('beforeend', markup);
    }
    add.addEventListener('click', function () {
        if (container.querySelectorAll('.osl-competition').length >= 20) { return; }
        var markup = document.getElementById('osl-new-competition-template').innerHTML.replace(/__C__/g, nextComp++);
        container.insertAdjacentHTML('beforeend', markup);
        addField(container.lastElementChild);
    });
    container.addEventListener('click', function (event) {
        var button = event.target.closest('button');
        if (!button) { return; }
        var comp = button.closest('.osl-competition');
        if (!comp) { return; }
        if (button.classList.contains('osl-add-field')) {
            if (comp.querySelectorAll('.osl-field-row').length < 20) { addField(comp); }
        } else if (button.classList.contains('osl-remove-field')) {
            if (comp.querySelectorAll('.osl-field-row').length > 1) { button.closest('.osl-field-row').remove(); }
        } else if (button.classList.contains('osl-remove-competition')) {
            if (container.querySelectorAll('.osl-competition').length > 1) { comp.remove(); }
        }
    });
});
</script>
<!-- ENDIF -->

<!-- IF S_OSL_CAN_SUBMIT_RESULT -->
<div class="panel bg3" id="osl-result-panel">
    <div class="inner">
        <fieldset class="fields2">
            <input type="hidden" name="osl_form_results" value="1" />
            <h3>{L_OSL_TAB_RESULT}</h3>
            <p>{L_OSL_RESULTS_HELP}</p>
            <!-- IF S_OSL_HAS_GROUPS -->
            <dl class="osl-member-group">
                <dt><label for="osl_shooter_group">{L_OSL_RESULT_GROUP}</label></dt>
                <dd>
                    <input class="inputbox autowidth" type="text" id="osl_shooter_group" name="osl_shooter_group" value="{OSL_SHOOTER_GROUP}" maxlength="100" size="40" />
                    <p><small>{L_OSL_GROUP_HELP}</small></p>
                </dd>
            </dl>
            <!-- ENDIF -->
            <!-- BEGIN osl_result_competitions -->
            <div class="osl-result-competition panel bg2" style="padding:12px;margin:12px 0">
                <h4>{osl_result_competitions.NAME}</h4>
                <label>
                    <input type="checkbox" class="osl-result-toggle" name="osl_selected[]" value="{osl_result_competitions.ID}"<!-- IF osl_result_competitions.SELECTED --> checked="checked"<!-- ENDIF --> />
                    {L_OSL_SUBMIT_RESULT}
                </label>
                <div class="osl-result-fields"<!-- IF not osl_result_competitions.SELECTED --> style="display:none"<!-- ENDIF -->>
                    <dl>
                        <dt><label for="osl_date_{osl_result_competitions.ID}">{L_OSL_RESULT_DATE}</label></dt>
                        <dd><input class="inputbox autowidth" type="date" id="osl_date_{osl_result_competitions.ID}" name="osl_date[{osl_result_competitions.ID}]" value="{osl_result_competitions.DATE}" /></dd>
                    </dl>
                    <!-- BEGIN osl_result_competitions.fields -->
                    <dl>
                        <dt><label for="osl_score_{osl_result_competitions.ID}_{osl_result_competitions.fields.INDEX}">{osl_result_competitions.fields.NAME} ({osl_result_competitions.fields.MIN}–{osl_result_competitions.fields.MAX})</label></dt>
                        <dd><input class="inputbox autowidth" type="number" step="0.01" id="osl_score_{osl_result_competitions.ID}_{osl_result_competitions.fields.INDEX}" name="osl_score[{osl_result_competitions.ID}][{osl_result_competitions.fields.INDEX}]" value="{osl_result_competitions.fields.VALUE}" min="{osl_result_competitions.fields.MIN}" max="{osl_result_competitions.fields.MAX}" /></dd>
                    </dl>
                    <!-- END osl_result_competitions.fields -->
                </div>
            </div>
            <!-- END osl_result_competitions -->
        </fieldset>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('#osl-result-panel .osl-result-toggle').forEach(function (toggle) {
        toggle.addEventListener('change', function () {
            var fields = toggle.closest('.osl-result-competition').querySelector('.osl-result-fields');
            fields.style.display = toggle.checked ? '' : 'none';
        });
    });
});
</script>
<!-- ENDIF -->
